<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login dengan Google — FlowGram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle at 50% 50%, #F8FAFC 0%, #EDF2F7 100%);
            color: #0F172A;
            overflow: hidden;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background: radial-gradient(circle at 50% 50%, #141722 0%, #0B0D13 100%);
                color: #F8FAFC;
            }
        }
        .status-card {
            text-align: center;
            padding: 40px 48px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 24px;
            box-shadow: 0 20px 40px -8px rgba(15, 23, 42, 0.12), 0 0 24px rgba(99, 102, 241, 0.1);
            max-width: 360px;
            width: 90%;
            animation: cardIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @media (prefers-color-scheme: dark) {
            .status-card {
                background: rgba(20, 23, 34, 0.85);
                border-color: rgba(255, 255, 255, 0.08);
                box-shadow: 0 24px 48px -8px rgba(0, 0, 0, 0.6), 0 0 24px rgba(129, 140, 248, 0.15);
            }
        }
        @keyframes cardIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .spinner-wrap {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 0 auto 20px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3.5px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366F1;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.3));
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status-title {
            font-size: 15px;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: -0.01em;
        }
        .status-badge {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px;
            animation: badgePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes badgePop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .success-badge {
            background: rgba(16, 185, 129, 0.12);
            color: #10B981;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
        }
        .error-badge {
            background: rgba(239, 68, 68, 0.12);
            color: #EF4444;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.3);
        }
        .success-text { color: #10B981; font-weight: 600; }
        .error-text { color: #EF4444; font-weight: 600; }
    </style>
</head>
<body>
    <div class="status-card" id="status" role="status" aria-live="polite">
        <div class="spinner-wrap"><div class="spinner"></div></div>
        <div class="status-title">Memproses login...</div>
    </div>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.hash.replace('#', '?'));
            var accessToken = params.get('access_token');
            var state = params.get('state');
            var error = params.get('error');

            var status = document.getElementById('status');

            if (error) {
                status.innerHTML = '<div class="status-badge error-badge">✕</div><div class="status-title error-text">Login dibatalkan atau gagal.</div>';
                setTimeout(function () { window.close(); }, 2000);
                return;
            }

            if (!accessToken || !state) {
                status.innerHTML = '<div class="status-badge error-badge">✕</div><div class="status-title error-text">Parameter tidak lengkap.</div>';
                setTimeout(function () { window.close(); }, 2000);
                return;
            }

            if (window.opener && typeof window.opener.__fgAuthCallback === 'function') {
                Promise.resolve(window.opener.__fgAuthCallback(accessToken, state))
                    .then(function (result) {
                        if (!result || result.ok !== true) {
                            status.innerHTML = '<div class="status-badge error-badge">✕</div><div class="status-title error-text">Login gagal. Silakan coba lagi.</div>';
                            setTimeout(function () { window.close(); }, 3000);
                            return;
                        }
                        status.innerHTML = '<div class="status-badge success-badge">✓</div><div class="status-title success-text">Login berhasil! Menutup...</div>';
                        setTimeout(function () { window.close(); }, 1000);
                    })
                    .catch(function () {
                        status.innerHTML = '<div class="status-badge error-badge">✕</div><div class="status-title error-text">Login gagal. Silakan coba lagi.</div>';
                        setTimeout(function () { window.close(); }, 3000);
                    });
            } else {
                status.innerHTML = '<div class="status-badge error-badge">✕</div><div class="status-title error-text">Popup tidak tersedia. Silakan coba login lagi dari halaman utama.</div>';
                setTimeout(function () { window.close(); }, 3000);
            }
        })();
    </script>
</body>
</html>

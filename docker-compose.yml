services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: "${FLOWGRAM_ALLOWED_ORIGIN:-http://localhost:3001}"
    ports:
      - "${FLOWGRAM_HOST_PORT:-3001}:3000"
    restart: unless-stopped
